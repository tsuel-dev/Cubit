name: Publish to npm

# Runs when a version tag such as v1.0.1 is pushed.
# Authentication: npm Trusted Publishing (OIDC). No NPM_TOKEN secret is needed once each
# package has a trusted publisher for this repository and workflow file (see PUBLISHING.md).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing and provenance

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Show tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Build All Packages
        run: pnpm run build

      - name: Run TypeScript Typecheck
        run: pnpm run typecheck

      - name: Check tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in tokens core react svelte; do
            V=$(node -p "require('./packages/$p/package.json').version")
            if [ "$V" != "$TAG" ]; then echo "packages/$p is $V but the tag is v$TAG"; exit 1; fi
          done

      - name: Publish packages
        run: node scripts/publish-packages.mjs
